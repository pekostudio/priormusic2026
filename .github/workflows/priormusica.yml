name: Deploy Laravel to CloudPanel

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CloudPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu

            cd /home/priormusica-app/htdocs

            if [ ! -d app.priormusica.lt/.git ]; then
              git clone https://github.com/pekostudio/priormusic2026.git app.priormusica.lt
            fi

            cd app.priormusica.lt

            git fetch origin main
            git reset --hard origin/main

            mkdir -p /home/priormusica-app/shared/audio
            
            if [ ! -L public/audio ]; then
              rm -rf public/audio
              ln -s /home/priormusica-app/shared/audio public/audio
            fi
          
            composer install --no-dev --optimize-autoloader

            npm ci
            npm run build

            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart
