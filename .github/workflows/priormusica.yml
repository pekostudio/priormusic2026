name: Deploy Laravel to CloudPanel

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate key
        run: php artisan key:generate

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to CloudPanel via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          PRODUCTION_ENV_BASE64: ${{ secrets.PRODUCTION_ENV_BASE64 }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: PRODUCTION_ENV_BASE64
          script: |
            set -e

            BASE_DIR="/home/priormusica-app/htdocs"
            APP_NAME="app.priormusica.lt"
            CURRENT_PATH="$BASE_DIR/$APP_NAME"
            RELEASES_DIR="$BASE_DIR/$APP_NAME-releases"
            SHARED_DIR="$BASE_DIR/$APP_NAME-shared"
            RELEASE_PATH="$RELEASES_DIR/${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
            AUDIO_WAS_MOVED=false

            mkdir -p "$RELEASES_DIR" "$SHARED_DIR/public"

            if [ ! -e "$SHARED_DIR/public/audio" ] && [ -d "$CURRENT_PATH/public/audio" ]; then
              mv "$CURRENT_PATH/public/audio" "$SHARED_DIR/public/audio"
              AUDIO_WAS_MOVED=true
            fi

            mkdir -p "$SHARED_DIR/public/audio"

            if [ "$AUDIO_WAS_MOVED" = true ]; then
              ln -sfn "$SHARED_DIR/public/audio" "$CURRENT_PATH/public/audio"
            fi

            if [ ! -f "$SHARED_DIR/.env" ] && [ -f "$CURRENT_PATH/.env" ]; then
              cp "$CURRENT_PATH/.env" "$SHARED_DIR/.env"
            fi

            if [ ! -f "$SHARED_DIR/.env" ] && [ -n "${PRODUCTION_ENV_BASE64:-}" ]; then
              printf '%s' "$PRODUCTION_ENV_BASE64" | base64 --decode > "$SHARED_DIR/.env"
              chmod 600 "$SHARED_DIR/.env"
            fi

            if [ ! -f "$SHARED_DIR/.env" ]; then
              echo "Missing $SHARED_DIR/.env. Copy the production .env there or add the PRODUCTION_ENV_BASE64 GitHub secret before deploying."
              exit 1
            fi

            rm -rf "$RELEASE_PATH"
            git clone --depth 1 https://github.com/pekostudio/priormusic2026.git "$RELEASE_PATH"

            cd "$RELEASE_PATH"

            ln -sfn "$SHARED_DIR/.env" .env
            rm -rf public/audio
            ln -sfn "$SHARED_DIR/public/audio" public/audio

            composer install --no-dev --optimize-autoloader

            npm ci
            npm run build

            php artisan migrate --force
            php artisan storage:link || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan queue:restart

            if [ -d "$CURRENT_PATH" ] && [ ! -L "$CURRENT_PATH" ]; then
              mv "$CURRENT_PATH" "$BASE_DIR/$APP_NAME.previous.$(date +%Y%m%d%H%M%S)"
            fi

            ln -sfn "$RELEASE_PATH" "$CURRENT_PATH"
